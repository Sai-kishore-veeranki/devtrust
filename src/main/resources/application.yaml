spring:
  application:
    name: devtrust

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: devtrust-correlation-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.vsk.devtrust.model"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  datasource:
    url: jdbc:postgresql://localhost:5432/devtrust
    username: devtrust
    password: devtrust123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: devtrust

devtrust:

  cors:
    # Comma-separated, e.g. https://devtrust.yourstartup.com — set via
    # DEVTRUST_CORS_ORIGINS in production. Defaults cover local Vite dev only.
    allowed-origins: ${DEVTRUST_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

  jwt:
    # No default on purpose, and no ":?message" syntax — that's a
    # docker-compose/shell construct, not something Spring's property
    # placeholder resolver understands. Omitting the default entirely is
    # what actually makes this required: Spring throws a clear
    # "could not resolve placeholder 'DEVTRUST_JWT_SECRET'" error at
    # startup instead of silently signing tokens with a guessable string.
    # Generate one with: openssl rand -base64 32
    secret: ${DEVTRUST_JWT_SECRET:devtrust-secret-key-please-change-me}
    expiration-minutes: ${DEVTRUST_JWT_EXPIRATION_MINUTES:1440}   # 24h — use 60 for a literal 1 hour

  ai:
    api-key: ${GROQ_API_KEY:test-api-key}
    api-url: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.3-70b-versatile

  prometheus:
    url: http://localhost:9090
    service-name: new-test-repo  # must match your GitHub repo name for correlation to work

  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:test-webhook-secret}
    token: ${GITHUB_TOKEN:test-github-token}

  kafka:
    topics:
      deployments: devtrust.deployments
      anomalies: devtrust.anomalies
      incidents: devtrust.incidents

  correlation:
    window-seconds: 300   # correlate anomalies within 5 minutes of a deployment